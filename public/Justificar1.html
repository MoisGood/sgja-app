<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Justificar1 - SGJA</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:#e8ecf1;padding:40px 16px;display:flex;justify-content:center;color:#1F2937}.wrap{max-width:860px;width:100%}.hdr{margin-bottom:20px}.hdr h1{font-size:18px;color:#1A3C6B;font-weight:700}.sec{background:#fff;border-radius:10px;box-shadow:0 2px 16px rgba(0,0,0,0.08);margin-bottom:24px;overflow:hidden}.sec:nth-child(odd){background:#fff}.sec:nth-child(even){background:#F3F4F6}.sec-hdr{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#F3F4F6;border-bottom:1px solid #E5E7EB;font-size:13px;font-weight:600}.badge{padding:2px 10px;background:#1A3C6B;color:#fff;font-size:10px;font-weight:600;border-radius:3px 3px 0 0}.tipo{font-size:10px;color:#6B7280;background:#E5E7EB;padding:1px 6px;border-radius:3px}.cnt{font-size:11px;color:#6B7280;margin-left:auto}.sec-body{display:flex;flex-direction:column;gap:14px;padding:18px 20px}.field-row{display:flex;gap:12px;align-items:stretch}.campo{background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}.campo>label{font-size:9px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:0.3px}.campo input[type="text"],.campo input[type="number"],.campo input[type="date"],.campo input[type="time"],.campo textarea{border:1px solid #d1d5db;border-radius:4px;padding:7px 10px;font-size:13px;font-family:inherit;color:#1F2937;background:#fff;width:100%}.campo input:focus,.campo textarea:focus{outline:none;border-color:#1A3C6B;box-shadow:0 0 0 2px rgba(26,60,107,0.15)}.fx1{flex:1;min-width:0}.fx2{flex:2;min-width:0}.fx3{flex:3;min-width:0}.fx4{flex:4;min-width:0}.fx5{flex:5;min-width:0}.fx-auto{flex:1 1 0%;min-width:0}.fx-none{flex:0 0 auto;width:auto}.sub-title{font-size:12px;font-weight:700;color:#374151;padding:6px 0 2px}.chk-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#374151;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:4px;padding:5px 10px;cursor:pointer}.campo textarea{min-height:100px;resize:vertical}.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid #E5E7EB;background:#f9fafb}.nav button{padding:8px 22px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #D1D5DB;background:#FFF;color:#374151}.nav .btn-end{background:#10B981;color:#fff;border-color:#10B981}@media(max-width:640px){body{padding:8px 6px}.sec-body{padding:12px;gap:10px}.field-row{flex-direction:column;gap:8px}.nav{flex-wrap:wrap;gap:8px;justify-content:center}}</style></head><body><div class="wrap"><div class="hdr"><h1>Justificar1</h1></div><form id="form" onsubmit="return false"><div class="sec" id="sec-s1"><div class="sec-hdr"><span class="badge">Formulario</span><span class="cnt">17 campos</span></div><div class="sec-body" style="gap:6px;"><div class="field-row"><div class="sub-title" style="font-size:36px;text-align:left;">Justifiación</div><div class="campo fx1"><label></label><input type="date" name=""></div><div class="campo fx1"><label></label><input type="time" name=""></div><div class="fx4"></div></div><div class="field-row"><div class="campo fx1"><label>RUT</label><div style="display:flex;gap:4px;align-items:center;"><input type="text" name="rut" placeholder="12.345.678-9" pattern="[0-9]{1,2}\.[0-9]{3}\.[0-9]{3}-[0-9kK]" autocomplete="off" style="flex:1;"><button type="button" onclick="buscarPorRut(this)" style="padding:7px 14px;background:#1A3C6B;color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">Buscar</button></div></div><div class="campo fx3"><label>NOMBRE ESTUDIANTE</label><input type="text" name="" placeholder="" autocomplete="off"></div></div><div class="field-row" adding:8px 18px;border-radius:6px;font-size:12px;z-index:9999;";document.body.appendChild(t);setTimeout(function(){t.remove();},2000);}function buscarPorRut(btn){var wrap=btn.parentElement;var inp=wrap.querySelector("input");var rut=inp.value.trim();if(!rut){inp.focus();return;}btn.textContent="Buscando...";btn.disabled=true;setTimeout(function(){btn.textContent="Buscar";btn.disabled=false;toast("RUT "+rut+" no encontrado");},1500);}</script></body></html>
