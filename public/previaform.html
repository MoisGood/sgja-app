<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista previa - SGJA</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#e8ecf1;min-height:100vh;display:flex;justify-content:center;padding:40px 16px;color:#1F2937}
.preview-wrap{max-width:860px;width:100%}
.preview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.preview-header h1{font-size:18px;color:#1A3C6B;font-weight:700}
.preview-header button{padding:8px 18px;border:1px solid #D1D5DB;border-radius:6px;background:#FFF;color:#374151;font-size:12px;cursor:pointer}
.preview-header button:hover{background:#f3f4f6}
.sec{background:#fff;border-radius:10px;box-shadow:0 2px 16px rgba(0,0,0,0.08);margin-bottom:24px;overflow:hidden}
.sec:nth-child(odd){background:#fff}
.sec:nth-child(even){background:#F3F4F6}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#F3F4F6;border-bottom:1px solid #E5E7EB;font-size:13px;font-weight:600}
.badge{padding:2px 10px;background:#1A3C6B;color:#fff;font-size:10px;font-weight:600;border-radius:3px 3px 0 0}
.tipo{font-size:10px;color:#6B7280;background:#E5E7EB;padding:1px 6px;border-radius:3px}
.cnt{font-size:11px;color:#6B7280;margin-left:auto}
.sec-body{display:flex;flex-direction:column;gap:14px;padding:18px 20px}
.field-row{display:flex;gap:12px;align-items:stretch}
.campo{background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.campo>label{font-size:9px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:0.3px}
.campo input[type="text"],.campo input[type="number"],.campo input[type="date"],.campo input[type="time"],.campo textarea{border:1px solid #d1d5db;border-radius:4px;padding:7px 10px;font-size:13px;font-family:inherit;color:#1F2937;background:#fff;width:100%}
.campo input:focus,.campo textarea:focus{outline:none;border-color:#1A3C6B;box-shadow:0 0 0 2px rgba(26,60,107,0.15)}
.fx1{flex:1;min-width:0}.fx2{flex:2;min-width:0}.fx3{flex:3;min-width:0}.fx4{flex:4;min-width:0}.fx5{flex:5;min-width:0}.fx-auto{flex:1 1 0%;min-width:0}.fx-none{flex:0 0 auto;width:auto}
.sub-title{font-size:12px;font-weight:700;color:#374151;padding:6px 0 2px}
.chk-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#374151;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:4px;padding:5px 10px;cursor:pointer}
.campo textarea{min-height:100px;resize:vertical}
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid #E5E7EB;background:#f9fafb}
.nav button{padding:8px 22px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #D1D5DB;background:#FFF;color:#374151}
.nav .btn-end{background:#10B981;color:#fff;border-color:#10B981}
.vacio{text-align:center;padding:60px 20px;color:#9CA3AF;font-size:14px}
.error-msg{text-align:center;padding:60px 20px;color:#DC2626;font-size:14px}
@media(max-width:640px){body{padding:8px 6px}.sec-body{padding:12px;gap:10px}.field-row{flex-direction:column;gap:8px}.nav{flex-wrap:wrap;gap:8px;justify-content:center}}
</style>
</head>
<body>
<div class="preview-wrap" id="app"></div>
<script>
const STORAGE_KEY = 'editor_form_v2';
const LEGACY_KEY = 'editor_form_v1';

function loadData() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    raw = localStorage.getItem(LEGACY_KEY);
    if (raw) return JSON.parse(raw);
    return null;
  } catch(e) { return null; }
}

function obtenerFilas(campos, secId) {
  const filas = [];
  const vistos = new Set();
  campos.forEach(c => {
    if (c.seccion === secId && c.fila && !vistos.has(c.fila)) {
      vistos.add(c.fila);
      filas.push(c.fila);
    }
  });
  return filas;
}

function itemLista(op) {
  const isCnt = op.charAt(op.length - 1) === '*';
  const body = isCnt ? op.slice(0, -1) : op;
  const isInp = body.indexOf('#') !== -1;
  let label = body;
  let n = '';
  let fijo = '';
  let ancho = 70;
  if (isInp) {
    const idx = body.indexOf('#');
    label = body.slice(0, idx).trim();
    let rest = body.slice(idx + 1);
    const fm = rest.match(/^(\d+)/);
    if (fm) { n = fm[1]; rest = rest.slice(fm[1].length); }
    fijo = rest.replace(/^\s*,\s*/, '').trim();
    ancho = n ? (35 * parseInt(n, 10) + 30) : 70;
  } else {
    label = body.trim();
  }
  return { isCnt, isInp, label, n, fijo, ancho };
}

function campoHTML(c) {
  const lbl = c.label || '';
  const fx = c.fx || 'fx1';
  const pSt = (c.padding ? ' padding:'+c.padding+';' : '') + (c.margin ? ' margin:'+c.margin+';' : '') + (c.zIndex ? ' position:relative;z-index:'+c.zIndex+';' : '');
  const st = pSt ? ' style="'+pSt.trim()+'"' : '';
  switch (c.tipo) {
    case 'text':
      return '<div class="campo ' + fx + '"' + st + '><label>' + lbl + '</label><div style="display:flex;align-items:center;gap:6px;">' + (c.labelCheck ? '<input type="checkbox" name="' + (c.name ? c.name+'_check' : '') + '" value="1" style="width:auto;flex:0 0 auto;">' : '') + '<input type="text" name="' + (c.name||'') + '" placeholder="' + (c.placeholder||'') + '"' + (c.maxlength ? ' maxlength="'+c.maxlength+'"' : '') + ' autocomplete="off" style="flex:1;">' + '</div></div>';
    case 'textarea':
      return '<div class="campo ' + fx + '"' + st + '><label>' + lbl + '</label><textarea name="' + (c.name||'') + '" placeholder="' + (c.placeholder||'') + '"' + (c.maxlength ? ' maxlength="'+c.maxlength+'"' : '') + '></textarea></div>';
    case 'date':
      return '<div class="campo ' + fx + '"' + st + '><label>' + lbl + '</label><input type="date" name="' + (c.name||'') + '"></div>';
    case 'time':
      return '<div class="campo ' + fx + '"' + st + '><label>' + lbl + '</label><input type="time" name="' + (c.name||'') + '"></div>';
    case 'checkbox':
      return '<div class="campo fx1"' + st + '><label class="chk-item"><input type="checkbox" name="' + (c.name||'') + '" value="1"> ' + (c.labelCheckbox || lbl || 'Casilla') + '</label></div>';
    case 'radio':
      var opsRadio = c.opciones && c.opciones.length ? c.opciones : ['Masculino','Femenino'];
      return '<div class="campo ' + fx + '"' + st + '><label>' + lbl + '</label><div style="display:flex;gap:10px;flex-wrap:wrap;">' + opsRadio.map(function(op){ return '<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;"><input type="radio" name="' + (c.name||'') + '" value="' + op + '"> ' + op + '</label>'; }).join('') + '</div></div>';
    case 'select':
      var optsSel = c.opciones && c.opciones.length ? c.opciones : ['Opcion 1','Opcion 2'];
      if (c.multiple) {
        var layGrid = c.layout === '2fil' ? 'grid-auto-flow:column;grid-template-rows:1fr 1fr;overflow-x:auto;' : 'grid-template-columns:1fr 1fr;overflow-y:auto;';
        if (c.contador) {
          return '<div class="campo ' + fx + '" style="position:relative;' + pSt + '"><label>' + lbl + ' <span class="cnt-total" style="color:#1A3C6B;font-weight:700;">0</span></label><button type="button" onclick="resetLista(this)" aria-label="Reiniciar contadores" style="position:absolute;top:4px;right:4px;display:inline-flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#1A3C6B;padding:2px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg></button><div style="display:grid;gap:6px;max-height:150px;' + layGrid + '">' + optsSel.map(function(op, i){
            var p = itemLista(op);
            var inp = p.isInp ? ' <input type="text" name="' + (c.name ? c.name+'_'+i : '') + '" data-w="' + p.n + '" placeholder="valor" style="width:' + p.ancho + 'px;padding:3px 6px;border:1px solid #d1d5db;border-radius:3px;font-size:12px;"' + (p.isCnt ? ' onclick="event.stopPropagation()"' : '') + '>' + (p.fijo ? ' <span class="fijo">' + p.fijo + '</span>' : '') : '';
            if (p.isCnt) return '<label class="cnt-item" onclick="event.preventDefault();incrementar(this)" ondblclick="event.preventDefault();resetItem(this)" style="display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none;"><input type="checkbox" name="' + (c.name||'') + '" value="' + op + '" style="pointer-events:none;"> ' + p.label + inp + ' <span class="cnt">(x0)</span></label>';
            return '<label style="display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;white-space:nowrap;"><input type="checkbox" name="' + (c.name||'') + '" value="' + op + '" onchange="actTotal(this.closest(\'.campo\'))"> ' + p.label + inp + '</label>';
          }).join('') + '</div></div>';
        }
        return '<div class="campo ' + fx + '"' + st + '><label>' + lbl + '</label><div style="display:grid;gap:6px;max-height:150px;' + layGrid + '">' + optsSel.map(function(op, i){
          var p = itemLista(op);
          var inp = p.isInp ? ' <input type="text" name="' + (c.name ? c.name+'_'+i : '') + '" data-w="' + p.n + '" placeholder="valor" style="width:' + p.ancho + 'px;padding:3px 6px;border:1px solid #d1d5db;border-radius:3px;font-size:12px;">' + (p.fijo ? ' <span class="fijo">' + p.fijo + '</span>' : '') : '';
          return '<label style="display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;white-space:nowrap;"><input type="checkbox" name="' + (c.name||'') + '" value="' + op + '"> ' + p.label + inp + '</label>';
        }).join('') + '</div></div>';
      }
      return '<div class="campo ' + fx + '"' + st + '><label>' + lbl + '</label><select name="' + (c.name||'') + '" style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;font-family:inherit;background:#fff;">' + optsSel.map(function(op){ return '<option value="' + op + '">' + op + '</option>'; }).join('') + '</select></div>';
    case 'label':
      var lblSt = (c.fontSize ? 'font-size:'+c.fontSize+';' : '') + (c.fontWeight ? 'font-weight:'+c.fontWeight+';' : '') + (c.textAlign ? 'text-align:'+c.textAlign+';' : '') + (c.fontColor ? 'color:'+c.fontColor+';' : '') + (c.zIndex ? 'position:relative;z-index:'+c.zIndex+';' : '');
      return '<div class="sub-title"' + (lblSt ? ' style="'+lblSt+'"' : '') + '>' + lbl + '</div>';
    case 'firma':
      return '<div class="campo fx2"' + st + ' style="text-align:center;' + (pSt || '') + '"><div style="height:24px;border-bottom:1px solid #000;margin-bottom:2px;"></div><div style="font-size:9px;color:#666;font-weight:600;">' + (c.firmaLabel || lbl || 'Firma') + '</div></div>';
    case 'linea':
      var lColor = c.lineColor || '#cccccc';
      var lWidth = c.lineWidth || '2px';
      var lStyle = c.lineStyle || 'solid';
      var lZ = c.zIndex ? 'position:relative;z-index:'+c.zIndex+';' : '';
      var lBg = lStyle==='dashed' ? 'background-image:repeating-linear-gradient(90deg,'+lColor+' 0,'+lColor+' 8px,transparent 8px,transparent 14px);background-color:transparent;' : lStyle==='dotted' ? 'background-image:radial-gradient(circle,'+lColor+' 1px,transparent 1px);background-size:6px 1px;background-color:transparent;' : 'background:'+lColor+';';
      var lFade = c.lineFade ? '-webkit-mask-image:linear-gradient(to right,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(to right,transparent,#000 15%,#000 85%,transparent);' : '';
      return '<div style="width:100%;height:'+lWidth+';margin:4px 0;' + lBg + lFade + lZ + '"></div>';
    case 'spacer':
      return '<div class="' + fx + '"' + st + '></div>';
    case 'buscarut':
      return '<div class="campo ' + fx + '"' + st + '><label>' + lbl + '</label><div style="display:flex;align-items:center;position:relative;"><input type="text" name="' + (c.name||'rut') + '" placeholder="12.345.678-9" pattern="[0-9]{1,2}\\.[0-9]{3}\\.[0-9]{3}-[0-9kK]" autocomplete="off" style="flex:1;padding-right:32px;"><button type="button" aria-label="Buscar" style="position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:none;color:#1A3C6B;cursor:pointer;padding:4px;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button></div></div>';
    case 'tabla':
      var cab = c.tablaCabeceras || ['Columna 1','Columna 2','Columna 3'];
      var nfilas = c.tablaFilas || 3;
      var tbl = '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;"><thead><tr>' + cab.map(function(h){return '<th style="border:1px solid #d1d5db;background:#f3f4f6;padding:6px 8px;font-size:11px;font-weight:600;color:#374151;text-align:left;">'+h+'</th>';}).join('') + '</tr></thead><tbody>';
      for (var ti=0;ti<nfilas;ti++) { tbl += '<tr>' + cab.map(function(){return '<td style="border:1px solid #e5e7eb;padding:6px 8px;height:28px;"></td>';}).join('') + '</tr>'; }
      tbl += '</tbody></table>';
      return '<div class="campo ' + fx + '"><label>' + lbl + '</label>' + tbl + '</div>';
    default:
      return '<div class="campo fx1"><label>' + lbl + '</label><input type="text" name="' + (c.name||'') + '"></div>';
  }
}

let seccionesData = [];
let currentIdx = 0;

function render() {
  const app = document.getElementById('app');
  const data = loadData();

  if (!data || !data.secciones || data.secciones.length === 0) {
    app.innerHTML = '<div class="error-msg">No hay datos del formulario.<br>Abre primero el editor y guarda el diseno.</div>';
    return;
  }

  seccionesData = data.secciones;
  currentIdx = 0;

  let html = '<div class="preview-header"><h1>Vista previa</h1><button onclick="window.close()">Cerrar</button></div>';
  html += mostrarSeccion(currentIdx, data.campos);
  app.innerHTML = html;
}

function mostrarSeccion(idx, campos) {
  const s = seccionesData[idx];
  if (!s) return '';
  const filas = obtenerFilas(campos, s.id);

  let html = '<div class="sec">';
  html += '<div class="sec-hdr">' +
    '<span class="badge">' + (s.label || 'Seccion ' + (idx+1)) + ' de ' + seccionesData.length + '</span>' +
    '<span class="tipo">' + (seccionesData.length > 1 ? 'Wizard' : 'Simple') + '</span>' +
    '<span class="cnt">' + campos.filter(c => c.seccion === s.id).length + ' campos</span>' +
  '</div>';

  html += '<div class="sec-body" style="gap:' + (s.rowGap||12) + 'px;">';
  if (filas.length === 0) {
    html += '<div class="vacio">(seccion sin campos)</div>';
  } else {
    filas.forEach(filaId => {
      const camposFila = campos.filter(c => c.fila === filaId && c.seccion === s.id);
      html += '<div class="field-row">';
      camposFila.forEach(c => { html += campoHTML(c); });
      html += '</div>';
    });
  }
  html += '</div>';

  if (seccionesData.length >= 2) {
    html += '<div class="nav">';
    if (idx > 0) {
      html += '<button type="button" onclick="navegar('+(idx-1)+')">Anterior</button>';
    } else {
      html += '<div></div>';
    }
    if (idx === seccionesData.length - 1) {
      html += '<button type="button" class="btn-end">Finalizar</button>';
    } else {
      html += '<button type="button" onclick="navegar('+(idx+1)+')">Siguiente</button>';
    }
    html += '</div>';
  }
  html += '</div>';

  return html;
}

function navegar(idx) {
  if (idx < 0 || idx >= seccionesData.length) return;
  currentIdx = idx;
  const data = loadData();
  if (!data) return;
  const app = document.getElementById('app');
  const header = app.querySelector('.preview-header');
  app.innerHTML = '';
  app.appendChild(header);
  app.insertAdjacentHTML('beforeend', mostrarSeccion(idx, data.campos));
}

function actTotal(campo) {
  let tot = 0;
  Array.from(campo.querySelectorAll('.cnt-item')).forEach(function(l) {
    tot += parseInt(l.querySelector('.cnt').textContent.replace(/\D/g, '')) || 0;
  });
  Array.from(campo.querySelectorAll('input[type=checkbox]')).forEach(function(chk) {
    if (!chk.closest('.cnt-item') && chk.checked) tot++;
  });
  const el = campo.querySelector('.cnt-total');
  if (el) el.textContent = tot;
}

function incrementar(lbl) {
  const chk = lbl.querySelector('input');
  const cnt = lbl.querySelector('.cnt');
  const n = parseInt((cnt.textContent || '').replace(/\D/g, '')) || 0;
  chk.checked = true;
  cnt.textContent = '(x' + (n + 1) + ')';
  actTotal(lbl.closest('.campo'));
}

function resetItem(lbl) {
  const chk = lbl.querySelector('input');
  const cnt = lbl.querySelector('.cnt');
  chk.checked = false;
  cnt.textContent = '(x0)';
  actTotal(lbl.closest('.campo'));
}

function resetLista(btn) {
  const campo = btn.closest('.campo');
  Array.from(campo.querySelectorAll('.cnt-item')).forEach(function(l) {
    l.querySelector('input').checked = false;
    l.querySelector('.cnt').textContent = '(x0)';
  });
  Array.from(campo.querySelectorAll('input[type=checkbox]')).forEach(function(chk) {
    if (!chk.closest('.cnt-item')) chk.checked = false;
  });
  actTotal(campo);
}

render();
</script>
</body>
</html>
