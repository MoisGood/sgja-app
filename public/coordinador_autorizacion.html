<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajuste de Coordenadas - Autorización Uso de Imagen</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #1a1a2e; color: #eee;
  overflow-x: hidden;
}
.toolbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  display: flex; align-items: center; gap: 8px; padding: 8px 14px;
  background: #16213e; border-bottom: 1px solid #0f3460;
  flex-wrap: wrap;
}
.toolbar h2 { font-size: 14px; font-weight: 600; margin-right: 4px; }
.toolbar button {
  padding: 6px 14px; border: none; border-radius: 5px;
  font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn-primary { background: #e94560; color: #fff; }
.btn-secondary { background: #0f3460; color: #fff; }
.toolbar label { font-size: 11px; color: #aaa; display: flex; align-items: center; gap: 4px; }
.toolbar input[type="number"] { width: 50px; padding: 3px 6px; font-size: 11px; border-radius: 3px; border: 1px solid #333; background: #222; color: #eee; }
.info { font-size: 11px; color: #888; margin-left: auto; }

.wrap {
  margin: 56px auto 20px;
  display: flex; justify-content: center;
}
.zoom-box {
  transform-origin: top center;
}
.grid-area {
  position: relative;
  width: 918px;   /* 612 × 1.5 */
  height: 1512px; /* 1008 × 1.5 */
  background: url('autorizacion_fondo-1.png') no-repeat center center;
  background-size: 100% 100%;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
}
.marker {
  position: absolute;
  width: 14px; height: 14px;
  margin-left: -7px; margin-top: -7px;
  border-radius: 50%;
  pointer-events: all;
  cursor: move;
  z-index: 10;
  border: 2px solid rgba(255,255,255,0.8);
  transition: box-shadow 0.1s;
}
.marker::after {
  content: attr(data-label) ' (' attr(data-x) ',' attr(data-y) ')';
  position: absolute;
  left: 16px; top: -4px;
  font-size: 9px; font-weight: 500;
  white-space: nowrap;
  color: #fff;
  text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 0 2px rgba(0,0,0,0.8);
  pointer-events: none;
  opacity: var(--label-opacity, 1);
}
.marker:hover { box-shadow: 0 0 0 3px rgba(255,255,255,0.5); z-index: 20; }
.marker.active { box-shadow: 0 0 0 4px #ff0; z-index: 30; }

#output {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #0d1117; border-top: 2px solid #27ae60;
  padding: 12px 16px; z-index: 2000;
  max-height: 220px; overflow: auto;
}
#output pre {
  font-size: 11px; color: #8b949e;
  white-space: pre-wrap; word-break: break-all;
}
#output .close-out {
  float: right; background: none; border: none;
  color: #888; font-size: 18px; cursor: pointer;
}
</style>
</head>
<body>

<div class="toolbar">
  <h2>🎯 Coordenadas - Autorización</h2>
  <button class="btn-primary" onclick="exportarCoords()">📋 Exportar</button>
  <button class="btn-secondary" onclick="resetearCoords()">↺ Reset</button>
  <label>Zoom <input type="number" id="zoomInput" value="1.0" min="0.3" max="3" step="0.1" onchange="reRender()"></label>
  <label><input type="checkbox" id="chkLabels" checked onchange="toggleLabels()"> Etiquetas</label>
  <span class="info" id="infoBar">Arrastra los marcadores sobre el PDF</span>
</div>

<div class="wrap">
  <div class="zoom-box" id="zoomBox">
    <div class="grid-area" id="gridArea">
      <div class="overlay" id="overlay" style="position:absolute;inset:0;"></div>
    </div>
  </div>
</div>

<div id="output">
  <button class="close-out" onclick="this.parentElement.style.display='none'">✕</button>
  <pre id="outputCode"></pre>
</div>

<script>
// ═══════════════════════════════════════════════
// Coordenadas en puntos PDF (612 × 1008)
// ═══════════════════════════════════════════════

const PDF_PT_W = 612;
const PDF_PT_H = 1008;
const PNG_SCALE = 1.5; // escala a la que se renderizó el PNG

const CAMPOS_INICIALES = [
  { key: 'nombre', x: 127, y: 455 },
  { key: 'run', x: 397, y: 455 },
  { key: 'fecha', x: 117, y: 432 },
  { key: 'firma', x: 253, y: 410 },
];

let campos = JSON.parse(JSON.stringify(CAMPOS_INICIALES));
let visualScale = 1.0; // zoom visual

// ── Renderizar ──
function reRender() {
  visualScale = parseFloat(document.getElementById('zoomInput').value) || 1.0;
  const zb = document.getElementById('zoomBox');
  zb.style.transform = 'scale(' + visualScale + ')';
  dibujarMarcadores();
  document.getElementById('infoBar').textContent = `Zoom: ${visualScale.toFixed(1)}x`;
}

function dibujarMarcadores() {
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = '';

  campos.forEach(c => {
    // Convertir PDF coords → PNG coords (× PNG_SCALE, Y invertido)
    const cx = c.x * PNG_SCALE;
    const cy = (PDF_PT_H - c.y) * PNG_SCALE;

    const div = document.createElement('div');
    div.className = 'marker';
    div.dataset.label = c.key;
    div.dataset.x = c.x;
    div.dataset.y = c.y;
    div.style.left = cx + 'px';
    div.style.top = cy + 'px';
    div.style.background = '#e94560';
    div._key = c.key;

    div.addEventListener('mousedown', (e) => {
      e.preventDefault();
      dragging = div;
      const rect = overlay.getBoundingClientRect();
      dragOffX = e.clientX - rect.left - parseFloat(div.style.left) * visualScale;
      dragOffY = e.clientY - rect.top - parseFloat(div.style.top) * visualScale;
      div.classList.add('active');
    });

    overlay.appendChild(div);
  });

  toggleLabels();
}

// ── Arrastre ──
let dragging = null;
let dragOffX = 0, dragOffY = 0;

document.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const overlay = document.getElementById('overlay');
  const rect = overlay.getBoundingClientRect();

  // Ajustar por el zoom visual
  let cx = (e.clientX - rect.left - dragOffX) / visualScale;
  let cy = (e.clientY - rect.top - dragOffY) / visualScale;

  const cw = overlay.clientWidth;
  const ch = overlay.clientHeight;
  cx = Math.max(0, Math.min(cw, cx));
  cy = Math.max(0, Math.min(ch, cy));

  dragging.style.left = cx + 'px';
  dragging.style.top = cy + 'px';

  const pdfX = Math.round(cx / PNG_SCALE);
  const pdfY = Math.round(PDF_PT_H - cy / PNG_SCALE);
  dragging.dataset.x = pdfX;
  dragging.dataset.y = pdfY;
  document.getElementById('infoBar').textContent =
    `→ ${dragging._key} → x:${pdfX}  y:${pdfY}`;
});

document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging.classList.remove('active');
  const key = dragging._key;
  const cx = parseFloat(dragging.style.left);
  const cy = parseFloat(dragging.style.top);
  const campo = campos.find(c => c.key === key);
  if (campo) {
    campo.x = Math.round(cx / PNG_SCALE);
    campo.y = Math.round(PDF_PT_H - cy / PNG_SCALE);
    dragging.dataset.x = campo.x;
    dragging.dataset.y = campo.y;
  }
  document.getElementById('infoBar').textContent =
    `✅ ${key} → x:${campo.x}  y:${campo.y}`;
  dragging = null;
});

function toggleLabels() {
  const show = document.getElementById('chkLabels').checked;
  document.querySelectorAll('.marker').forEach(m => {
    m.style.setProperty('--label-opacity', show ? '1' : '0');
  });
}

function exportarCoords() {
  const code = `const CAMPOS: Campo[] = [\n${campos.map(c =>
    `  { key: '${c.key}', x: ${c.x}, y: ${c.y} }`
  ).join(',\n')}\n];`;

  document.getElementById('outputCode').textContent = code;
  document.getElementById('output').style.display = 'block';
  navigator.clipboard.writeText(code).catch(() => {});
  document.getElementById('infoBar').textContent = '✅ Coordenadas copiadas al portapapeles';
}

function resetearCoords() {
  campos = JSON.parse(JSON.stringify(CAMPOS_INICIALES));
  dibujarMarcadores();
  document.getElementById('infoBar').textContent = '↺ Coordenadas restauradas';
}

// ── Iniciar ──
reRender();
</script>
</body>
</html>
